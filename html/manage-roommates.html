<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Roommates</title>
    <link rel="stylesheet" href="../CSS/allcss.css">
    <script type="text/javascript" src="/JS/roommates.js" defer></script>
</head>
<body>

<div class="topPage">
    <h1 id="greeting-message"></h1>
    <p><span id="hour"></span></p>
</div>

<div class="centerPage">
    <div class="infoPage" id="manageRoommatesCard">

        <div class="action-header">
            <div class="header-top">
                <h2>List of roomates</h2>
                <button class="btn btn-add" id="addRoommateBtn">+ Add roommate</button>
            </div>
            <h3 id="error-section"></h3>
        </div>

        <div class="roommateForm">
            <button type="button" class="btn btn-back" id="backRoommateBtn">Back</button>
            <form id="roommateForm" method="post">
                <label for="email">Email: </label>
                <input id="email" type="email">
                <label for="firstname">Firstname:</label>
                <input id="firstname" type="text">
                <label for="lastname">Lastname:</label>
                <input id="lastname" type="text">
                <label for="phonenumber">Phonenumber: </label>
                <input id="phonenumber" type="tel">
                <button id="createRoommateBtn">Create roommate</button>
            </form>
        </div>

        <div class="roommates-container" id="roommatesList">
            <div class="roommate-item">
                <div class="roommate-info">
                    <span class="roommate-name">Alexandre Dupont</span>
                    <div class="roommate-details">Room n°1 — alex.dupont@email.com</div>
                </div>
                <button class="btn btn-delete">- Delete</button>
            </div>

            <div class="roommate-item">
                <div class="roommate-info">
                    <span class="roommate-name">Sophie Martin</span>
                    <div class="roommate-details">Room n°2 — sophie.m@email.com</div>
                </div>
                <button class="btn btn-delete">- Delete</button>
            </div>

            <div class="roommate-item">
                <div class="roommate-info">
                    <span class="roommate-name">Lucas Bernard</span>
                    <div class="roommate-details">Room n°3 — lucas.b@email.com</div>
                </div>
                <button class="btn btn-delete">- Delete</button>
            </div>
        </div>

        <div class="statusCard">
            <p><strong>In the shared home :</strong> <span id="numberOfRoommates"></span>/30 roommates in total.</p>
        </div>

    </div>
</div>

<div class="footerApp">
    <a class="ButtonApp" id="roommatesButton" href="#" style="border: 4px solid red;"></a>
    <a class="ButtonApp" id="supportButton" href="support.html"></a>
    <a class="ButtonApp" id="moreButton" href="owner.html"></a>
    <a class="ButtonApp" id="rentButtonOwner" href="manage-rent.html"></a>
    <a class="ButtonApp" id="logout" href="login.html"></a>
</div>

</body>
</html>
