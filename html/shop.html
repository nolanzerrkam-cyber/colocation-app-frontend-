<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list</title>
    <link rel="stylesheet" href="../CSS/allcss.css">
    <script type="module" src="../JS/appjs.js" defer></script>
    <script type="module" src="../JS/shop.js" defer></script>
</head>
<body>
<div class="topPage">
    <div class="brand">
        <img src="../image/logocoloc-removebg-preview.png"/>
        <img src="../image/nomcoloc-removebg-preview.png"/>
    </div>
    <div id="hour"></div>
    <a class="red-button" href="login.html" id="logout">Logout</a>
</div>
<div class="centerPage">
    <div class="infoPage">
        <div class="title-div">
            <h1>Shopping items list</h1>
            <p id="add-shopping-item" class="add-element-btn">+</p>
        </div>
        <div id="shopping-items-list"></div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal-card">
        <button type="button" class="close-btn" id="closeBtn">&times;</button>

        <h2 class="title">Add a shopping item</h2>

        <form id="shoppingItemsForm">
            <div class="form-group">
                <label for="itemLabel">LABEL</label>
                <input type="text" id="itemLabel" name="label" placeholder="Biscuits" required/>
            </div>

            <div id="form-group" class="form-group">
                <label for="quantity">QUANTITY</label>
                <input type="number" min="1" id="quantity" name="quantity" placeholder="1"/>
            </div>

            <button type="submit" class="submit-btn" id="submit-button">Create shopping item</button>
            <p id="notifier">p</p>
        </form>

    </div>
</div>

<div class="footerApp">
    <a class="ButtonApp" id="rentButton" href="rent.html"></a>
    <a class="ButtonApp" id="choresButton" href="chores.html"></a>
    <a class="ButtonApp" id="moreButton" href="../index.html"></a>
    <a class="ButtonApp" id="expensesButton" href="expenses.html"></a>
    <a class="ButtonApp" id="shopButton" href="#"></a>
</div>
</body>
