<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Roomates [Owner]</title>
    <link rel="stylesheet" href="../CSS/allcss.css">
    <script type="module" src="../JS/appjs.js" defer></script>
    <script type="module" src="../JS/manage-roommates.js" defer></script>
</head>
<body>

    <div class="topPage">
        <div class="brand">
            <img src="../image/logocoloc-removebg-preview.png"/>
            <img src="../image/nomcoloc-removebg-preview.png"/>
        </div>
        <div id="hour"></div>
        <a id="logout" href="login.html" >Logout</a>
    </div>

    <div class="centerPage">
        <div class="infoPage" id="manageRoommatesCard">
            
            <div class="action-header">
                <div class="header-top">
                    <h2>List of roomates</h2>
                    <button class="btn btn-add" id="openRoommateModal">+ Add roommate</button>
                </div>
                <h3 id="error-section"></h3>
            </div>

            <div id="modalOverlay" class="modal-overlay">
                <div class="modal-card">
                    <button type="button" class="close-btn" id="closeBtn">&times;</button>

                    <h2 class="title">Adding a roommate</h2>

                    <form id="roommateForm">
                        <div class="form-group">
                            <label for="roommateName">Full name</label>
                            <input type="text" id="roommateName" name="name" placeholder="Max Verstappen" required/>
                        </div>

                        <div class="form-group">
                            <label for="roommateEmail">Email</label>
                            <input type="email" id="roommateEmail" name="email" placeholder="Max.Verstappen@condorcet.be" required/>
                        </div>

                        <div class="form-group">
                            <label for="roommatePhoneNumber">Phone Number</label>
                            <input type="tel" id="roommatePhoneNumber" name="phoneNumber" placeholder="012345678" required/>
                        </div>

                        <div class="form-group">
                            <label for="roommatePassword">Password</label>
                            <input type="password" id="roommatePassword" name="password" placeholder="***********" required/>
                        </div>

                        <button type="submit" class="submit-btn" id="submit-button">Confirm the creation</button>
                        <p id="notifier"></p>
                    </form>
                </div>
            </div>

            <div class="roommates-container" id="roommatesList">
                <div class="roommate-item">
                    <div class="roommate-info">
                        <span class="roommate-name">Alexandre Dupont</span>
                        <div class="roommate-details">Room n°1 — alex.dupont@email.com</div>
                    </div>
                    <button class="btn btn-delete">- Delete</button>
                </div>

                <div class="roommate-item">
                    <div class="roommate-info">
                        <span class="roommate-name">Sophie Martin</span>
                        <div class="roommate-details">Room n°2 — sophie.m@email.com</div>
                    </div>
                    <button class="btn btn-delete">- Delete</button>
                </div>

                <div class="roommate-item">
                    <div class="roommate-info">
                        <span class="roommate-name">Lucas Bernard</span>
                        <div class="roommate-details">Room n°3 — lucas.b@email.com</div>
                    </div>
                    <button class="btn btn-delete">- Delete</button>
                </div>
            </div>

            <div class="statusCard">
                <p><strong>In the shared home :</strong> <span id="numberOfRoomates"></span>/30 roomates in total.</p>
            </div>

        </div>
    </div>

    <div class="footerApp">
        <a class="ButtonApp" id="roomatesButton" href="#" ></a>
        <a class="ButtonApp" id="moreButton" href="owner.html"></a>
        <a class="ButtonApp" id="rentButtonOwner" href="manage-rent.html"></a>
    </div>

</body>
</html>
