<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent to pay</title>    
    <link rel="stylesheet" href="../CSS/allcss.css">
    <script type="module" src="../JS/appjs.js" defer></script>
    <script type="module" src="../JS/rent.js"></script>
</head>
<body>
<div class="topPage">
    <div class="brand">
        <img src="../image/logocoloc-removebg-preview.png"/>
        <img src="../image/nomcoloc-removebg-preview.png"/>
    </div>
    <div id="hour"></div>
    <a class="red-button" href="login.html" id="logout" >Logout</a>
</div>
    <div class="centerPage">
        <div class="infoPage">
            <h1>Your rent to pay :</h1>
            <div id="rent-details">
                <div class="rent-card">
                    <span class="subtitle">Your share</span>
                    <p class="rent-share"><span id="rent-share">300.00</span> €</p>
                    <div class="rent-line"><span>Total rent</span><span id="rent-total">900.00 €</span></div>
                    <hr class="separator">
                    <div class="rent-line"><span>Deadline</span><span id="rent-deadline">26 November 2026, 18:00</span></div>
                </div>
                <p id="rent-status" class="rent-badge unpaid">To pay</p>
            </div>
        </div>
    </div>
    <div class="footerApp">
        <a class="ButtonApp" id="rentButton" href="#"></a>
        <a class="ButtonApp" id="choresButton" href="chores.html"></a>
        <a class="ButtonApp" id="moreButton" href="../index.html"></a>
        <a class="ButtonApp" id="expensesButton" href="expenses.html"></a>
        <a class="ButtonApp" id="shopButton" href="shop.html"></a>
    </div>
</body>
