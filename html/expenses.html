<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses</title>
    <link rel="stylesheet" href="../CSS/allcss.css">
    <script type="module" src="../JS/appjs.js" defer></script>
    <script type="module" src="../JS/expenses.js" defer></script>
</head>
<body id="expense-page" class="background">
<div class="topPage">
    <div class="brand">
        <img src="../image/logocoloc-removebg-preview.png" alt="FlatMate Icon"/>
        <img src="../image/nomcoloc-removebg-preview.png" alt="FlatMate Logo"/>
    </div>
    <div id="hour"></div>
    <a class="red-button" href="login.html" id="logout" >Logout</a>
    <a class="ButtonApp" id="settingsButton" href="settings.html"></a>
</div>
<main>
    <div class="centerPage">
        <div class="infoPage">
            <div id="title-expense">
                <h1>Expenses</h1>
                <p id="add-expense">+</p>
            </div>
            <div id="balance-div">
                <div>
                    <h2>YOUR BALANCE</h2>
                    <p id="balance"></p>
                    <div class="separator"></div>
                    <p id="total-container"><span>Total shared across the colocation</span><span id="total-expenses"></span></p>
                </div>
            </div>
        <div>
        <h2 id="recent-expenses-title">Expenses</h2>
        <div id="expenses-list"></div>
        </div>
        </div>
    </div>
    <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <p>Delete this expense ?</p>
            <div class="modal-buttons">
                <button id="cancelDeleteBtn" class="modal-btn-cancel">Keep</button>
                <button id="confirmDeleteBtn" class="modal-btn-confirm">Delete</button>
            </div>
        </div>
    </div>
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-card">
            <button type="button" class="close-btn" id="closeBtn">&times;</button>

            <h2 class="title">Add an expense</h2>

            <form id="expenseForm">
                <div class="form-group">
                    <label for="expenseName">EXPENSE NAME</label>
                    <input type="text" id="expenseName" name="name" placeholder="Claude code subscription" required/>
                </div>

                <div id="form-group-price" class="form-group">
                    <label for="price">PRICE</label>
                    <input type="number" step="0.01" min="0" id="price" name="price" placeholder="10,50€" required/>
                </div>

                <div id="form-group-date" class="form-group">
                    <label for="date">DATE</label>
                    <input type="datetime-local" id="date" name="date" required/>
                </div>

                <button type="submit" class="submit-btn" id="submit-button">Create expense</button>
                <p id="notifier">p</p>
            </form>

        </div>
    </div>

</main>
<div class="footerApp">
    <a class="ButtonApp" id="rentButton" href="rent.html"></a>
    <a class="ButtonApp" id="choresButton" href="chores.html"></a>
    <a class="ButtonApp" id="moreButton" href="../index.html"></a>
    <a class="ButtonApp" id="expensesButton" href="#"></a>
    <a class="ButtonApp" id="shopButton" href="shop.html"></a>
</div>
</body>
