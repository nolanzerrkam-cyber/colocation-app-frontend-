<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Overview [Owner]</title>
    <link rel="stylesheet" href="../CSS/allcss.css">
    <script type="module" src="../JS/appjs.js" defer></script>
    <script type="module" src="../JS/rent-owner.js"></script>
</head>
<body>
<div class="topPage">
    <div class="brand">
        <img src="../image/logocoloc-removebg-preview.png"/>
        <img src="../image/nomcoloc-removebg-preview.png"/>
    </div>
    <div id="hour"></div>
    <a class="red-button" href="login.html" id="logout" >Logout</a>
</div>

    <div class="centerPage">
        <div class="infoPage" id="manageRentCard">
            <h2>Rent Overview</h2>
            <h3 id="rent-title"></h3>
            <div class="rent-summary-line">
                <p class="rent-summary" id="rent-summary"></p>
                <button class="edit-icon" id="edit-rent" title="Edit total rent">✏️</button>
            </div>

            <div class="rent-list" id="roommates-rent-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <button class="close-btn" id="closeBtn">×</button>
            <span class="subtitle">Rent</span>
            <h2 class="title">Edit the total rent</h2>
            <form id="rentForm">
                <div class="form-group">
                    <label for="amount">Total rent (€)</label>
                    <input type="number" id="amount" name="amount" min="1" step="0.01">
                </div>
                <button type="submit" class="submit-btn" id="submit-button">Save</button>
                <p id="notifier"></p>
            </form>
        </div>
    </div>

    <div class="footerApp">
        <a class="ButtonApp" id="roomatesButton" href="manage-roommates.html"></a>
        <a class="ButtonApp" id="moreButton" href="owner.html"></a>
        <a class="ButtonApp" id="rentButtonOwner" href="#"></a>
    </div>
</body>
</html>
